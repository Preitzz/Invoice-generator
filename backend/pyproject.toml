[project]
name = "invoice-reminder-backend"
version = "0.1.0"
description = "Invoice Generator with Payment-Reminder Engine — backend API and worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "factory_boy>=3.3",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
